plugins {
 id 'fabric-loom' version '1.7.4'
 id 'maven-publish'
}
base { archivesName = 'witchersbestiary' }
repositories { maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
repositories { maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } }
repositories { maven { url = 'https://maven.modmuss50.me/'; content { includeGroup 'me.zeroeightsix' } } }
loom {
 splitEnvironmentSourceSets()
 mods { witchersbestiary { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
repositories { maven { url = 'https://maven.terraformersmc.com/releases/' } }
dependencies {
 modCompileOnly 'com.terraformersmc:modmenu:11.0.3'
 if(project.hasProperty('stage18WithMenu')) modRuntimeOnly 'com.terraformersmc:modmenu:11.0.3'
 if(project.hasProperty('stage19fProfile')) modCompileOnly 'maven.modrinth:5aaWibi9:JagCscwi'
 else modImplementation 'maven.modrinth:5aaWibi9:JagCscwi'
 if(project.hasProperty('stage19fProfile')) modCompileOnly('org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0') { transitive = false }
 else modImplementation('org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0') { transitive = false }
 if(project.hasProperty('stage19fProfile')) modCompileOnly('org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.0') { transitive = false }
 else modImplementation('org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.0') { transitive = false }
 minecraft "com.mojang:minecraft:${minecraft_version}"
 mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
 modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
 modImplementation 'maven.modrinth:nU0bVIaL:XIjNwQkI'
 // Loom's development classpath excludes Patchouli's nested Fiber jar.
 // The distributed Patchouli jar already contains it.
 modRuntimeOnly 'me.zeroeightsix:fiber:0.23.0-2'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

// Тестовый мод не включается в распространяемый JAR.
sourceSets {
 gametest {
  compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
  runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
 }
 clientSmoke {
  compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
  runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
 }
}
loom {
 mods {
  'witchersbestiary-tests' { sourceSet sourceSets.gametest }
  'witchersbestiary-client-tests' { sourceSet sourceSets.clientSmoke }
 }
