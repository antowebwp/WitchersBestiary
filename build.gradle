  modRuntimeOnly fileTree(dir: 'build/stage10-bop-mods', include: '*.jar')
  runtimeOnly fileTree(dir: 'build/stage10-bop-libraries', include: '*.jar')
 }
 loom.runs.stage10Natural.vmArg '-Dwitchersbestiary.stage10Bop=true'
 loom.runs.stage11Natural.vmArg '-Dwitchersbestiary.stage10Bop=true'
 loom.runs.stage13Natural.vmArg '-Dwitchersbestiary.stage10Bop=true'
 loom.runs.stage14Natural.vmArg '-Dwitchersbestiary.stage10Bop=true'
}

// Audit the distributed jar, not only the named development environment.
tasks.register('verifyReleaseMixins') {
 dependsOn tasks.named('remapJar')
 inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
 doLast {
  def jarFile = tasks.named('remapJar').get().archiveFile.get().asFile
  def json = new groovy.json.JsonSlurper()
  new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
   def readJson = { name ->
    def entry = zip.getEntry(name)
    if (entry == null) throw new GradleException("Missing release resource: ${name}")
    json.parse(zip.getInputStream(entry))
   }
   def mod = readJson('fabric.mod.json')
   def configs = mod.mixins.collect { it instanceof String ? it : it.config }
   def covered = [] as Set
   configs.each { name ->
    def config = readJson(name)
    if (!config.refmap) throw new GradleException("Missing refmap in ${name}")
    def refs = readJson(config.refmap).mappings
    ((config.mixins ?: []) + (config.client ?: [])).each { shortName ->
     def key = config.package.replace('.', '/') + '/' + shortName
     if (!zip.getEntry(key + '.class') || !refs[key]) throw new GradleException("Missing class/refmap mapping for ${key} in ${name}")
     refs[key].each { selector, target ->
      if (!(target =~ /(?:method|field)_\d+/)) throw new GradleException("Unmapped release selector ${key}: ${selector} -> ${target}")
     }
     covered.add(shortName)
    }
   }
   if (covered != ['LivingEntityMixin', 'BasiliskLavaContactMixin', 'ItemStackOilTooltipMixin', 'SpawnRestrictionAccessor', 'RootPlayerMovementMixin', 'MonsterAiMixin', 'RecipeCatalogReloadMixin', 'ProgressiveHealthAttributeMixin'] as Set) throw new GradleException("Unexpected production mixins: ${covered}")
   def client = readJson('witchersbestiary.client.mixins.json')
   def mappings = readJson(client.refmap).mappings['com/witchersbestiary/combat/mixin/RecipeCatalogReloadMixin']
   def selector = 'onSynchronizeRecipes(Lnet/minecraft/network/packet/s2c/play/SynchronizeRecipesS2CPacket;)V'
   if (mappings[selector] != 'Lnet/minecraft/class_634;method_11106(Lnet/minecraft/class_2788;)V')
    throw new GradleException("Recipe sync does not map to the Minecraft 1.21.1 target: ${mappings}")
   logger.lifecycle("Verified all ${covered.size()} release mixins and recipe-sync client refmap")
  }
 }
}
tasks.named('check') { dependsOn tasks.named('verifyReleaseMixins') }

